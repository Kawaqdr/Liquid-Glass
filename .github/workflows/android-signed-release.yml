name: Build Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore and detect key alias
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" ]]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD repository secret."
            exit 1
          fi

          KEYSTORE_PATH="${RUNNER_TEMP}/liquid-glass-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"

          KEY_ALIAS="$(keytool -list -v -keystore "${KEYSTORE_PATH}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" 2>/dev/null | awk '/Alias name:/{alias=$0; sub(/^.*Alias name: /,"",alias)} /Entry type: PrivateKeyEntry/{print alias; exit}')"
          if [[ -z "${KEY_ALIAS}" ]]; then
            echo "::error::No PrivateKeyEntry alias found. Check that the keystore and store password are correct."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=${KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "Keystore decoded and signing alias detected."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "::error::Missing ANDROID_KEY_PASSWORD repository secret."
            exit 1
          fi
          gradle :app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
